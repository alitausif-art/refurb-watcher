name: keepalive

# GitHub disables scheduled workflows in public repos after 60 days without repository activity.
# The M7 watcher commits state only when it alerts, which can be months apart, so this heartbeat matters.
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refurb-state
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Commit heartbeat
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .keepalive
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .keepalive
          git commit -m 'chore: keep scheduled workflows alive'
          git pull --rebase
          git push

      # Belt and braces in case bot commits ever stop counting as activity.
      - name: Re-enable m7 workflow
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/m7.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
